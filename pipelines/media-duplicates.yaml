name: media-duplicates
description: Decide again the duplicate findings of a staged file, or of the staged copies of a library file

# `media.duplicates.stale` names a file whose findings may be wrong: one moved into a staging inbox
# from elsewhere, or into the library from outside it; a directory moved in whole, whose files
# the step takes one by one; or a file in either whose fingerprints landed once its capture time
# was read (`@archive/staging/facts`). Every findings write goes through
# `@archive/staging/duplicates`; a staged file's arrival is checked by its hold (`staging-hold`)
# itself, so it needs no fact.
trigger:
  on: media.duplicates.stale
  wants: archive

steps:
  record:
    command: duplicates --record $NODE_PATH
    description: Decide the exact copies among the file's byte twins in each staging inbox
    pool: media
    kind: dedupe
    priority: 20
    requires:
      cpu: 1

options:
  maxAttempts: 2
  priority: 0
