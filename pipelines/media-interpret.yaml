name: media-interpret
description: Read what a file's metadata means in the archive - its capture time and place - which the archive's analysis waits on

# The media module reads a file and keeps its metadata (`exif-extract`); this is the archive's
# only pipeline on that fact. `exif-interpret` resolves the capture time from the clocks, the
# camera, a sidecar and the name, and writes the position; its last write is announced as
# `media.metadata.interpreted`, which starts faces and the camera link. Read again
# whenever the file is: a file whose bytes changed is read again, and so is its meaning.
trigger:
  on: media.metadata.extracted
  wants: archive

steps:
  exif-interpret:
    command: exif-interpret $NODE_PATH
    description: Resolve the capture time and write the position from the read metadata
    pool: media
    kind: interpret
    priority: 100
    requires:
      cpu: 1

options:
  maxAttempts: 3
  priority: 20
