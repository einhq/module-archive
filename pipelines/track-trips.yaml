name: track-trips
description: Derive a track's trips and stays again when its fixes, kind, timezone, device's class or homes change, put the stays at named locations, and give the trips their weather

# Subject is the track, a device's track endpoint under /dev. The fact comes from archive-bridge:
# points were appended to it, its kind or timezone or its device's class changed, or a home was
# added or taken off.
trigger:
  on: track.changed

steps:
  trips:
    command: track-trips $NODE_PATH
    description: Read the track from where its trips are settled, and write them to its .trips
  places:
    # Network lookups for the stays not placed yet; one that fails is asked again on the next run.
    command: track-places $NODE_PATH
    description: Put each new stay at the location within 150 m, or at one named after the harbour, island, bay or town there
    dependsOn: [trips]
  weather:
    # Network lookups too, unless CFG_WEATHER is turned off; a trip whose lookup fails is asked again on the next run.
    command: track-weather $NODE_PATH
    description: Sample each trip's track once an hour and write the weather of each day and of the whole trip
    dependsOn: [places]

options:
  # A live tracker appends every few seconds. Waiting ten minutes from the first append of a burst
  # folds it into one run, and `rerun` gives the appends a run could not have seen one more.
  coalesce: rerun
  debounceMs: 600000
  maxAttempts: 2
  priority: 5
