name: media-face-transfer
description: Move legacy manual face tags onto detected faces

# `detect-faces` writes facesAt only after every detection and crop is complete,
# including on a zero-face image. The bridge derives this fact from that durable
# marker, so the transfer is independently visible and retryable without holding
# a model slot open for work that never calls EMS.
#
# Order against `assign-faces` does not matter: it triggers per detected face and
# may get there first, while `tag-transfer` is allowed to replace an `auto`
# assignment with the legacy manual identity. If this job gets there first,
# assignment sees personId and skips.
trigger:
  on: media.faces.completed
  match:
    mimetype: image/*

steps:
  transfer:
    command: tag-transfer --file $NODE_PATH
    description: Move legacy manual tags onto detections and delete them, crop the ones left behind
    pool: media
    kind: face-transfer
    priority: 90
    requires:
      cpu: 1

options:
  maxAttempts: 3
  priority: 10
