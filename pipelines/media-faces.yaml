name: media-faces
description: Detect faces in an image and crop each one

# Highest-priority model work: faces run ahead of the other model kinds because
# assignment, and people showing up in the UI, wait on a detected face the way nothing
# waits on a transcript or a vector.
#
# The guard is a marker on the file node, not the `regions/` directory (once
# `faces/`). Those are not the same predicate: the legacy importer creates
# `manual-<n>` tags at import time, so `skipIfExists` on the directory skipped detection on exactly
# the images carrying legacy identity — measured on the real corpus as 0 images
# holding both a tag and a detection, which left `tag-transfer` inert and
# recognition with no anchors. `facesAt` says the detector ran, which a directory
# someone else wrote never did — and it is the marker the staging organizer
# reads to decide whether a file's people signal is complete.
trigger:
  on: media.metadata.extracted
  match:
    mimetype: image/*
  skipIfAttr: facesAt

steps:
  detect-faces:
    command: detect-faces $NODE_PATH
    description: InsightFace detection plus a cropped image per face
    pool: media
    kind: faces
    priority: 100
    requires:
      models: 1

options:
  maxAttempts: 3
  priority: 10
