name: track-stage
description: A GPX file dropped in staging becomes the route of the device it was recorded on

# Subject is the GPX file. `updated` is the upload's size report, after the bytes
# have landed; a file left waiting for a device is not tried again — the staging
# page asks which device it belongs to.
trigger:
  event: updated
  nodeType: file
  match:
    nodePath: ['/home/*/staging/**.gpx', '/home/*/staging/**.GPX']
  skipIfAttr: trackPending

steps:
  import:
    command: track-stage $NODE_PATH
    description: Write it to the device it names, whose driver reads its fixes into its track, and move it to that track's routes/

options:
  maxAttempts: 2
  priority: 5
