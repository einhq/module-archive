# A pass of `media-scan` over the archive, which announces every gap a pipeline missed: a file
# never taken in or interpreted, faces, a transcript, voices or extracted text a crash lost, a
# transcript or vectors from a superseded model or setting, a photo's place or weather. Renditions, picture vectors and
# fingerprints are the media module's to heal (its `renditions-heal`, `pictures-heal` and
# `fingerprints-heal` services). The fact comes from `media-heal`, which the media-heal service
# runs as a clock; its subject is the root to walk, the albums or a user's staged files, so each
# root has one instance, and a fact arriving while its pass runs is dropped.
#
# `--if-idle` holds back each fact a pipeline with work ready would take, and `$EVENT_ONLY` is the
# types the last pass held back, empty for every type. The engine substitutes it quoted, and an
# empty value as nothing, so it goes after `=`: `--only=` is every type. The pass is one run:
# media-scan stores where it is on the root as it goes, so a step run again after EiN restarted
# goes on from there.
#
# Run by the engine rather than from a pool: a pool job counts as work waiting, and a pass is
# housekeeping, not backlog. It holds one of the engine's inline permits while it runs.
name: media-heal
description: Announce every gap the media pipelines missed, in one pass over the albums or a staging area

trigger:
  on: media.heal.due

steps:
  scan:
    command: media-scan --if-idle --only=$EVENT_ONLY --scan-limit 0 --limit 0 --max-active 0 $NODE_PATH
    description: Walk the archive and announce each file's gaps whose work is not already waiting

options:
  maxAttempts: 3
