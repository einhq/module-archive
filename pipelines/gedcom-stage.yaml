name: gedcom-stage
description: A GEDCOM file dropped in staging waits in its staging area's genealogy/ to be looked over and imported

# Subject is the GEDCOM file. `updated` is the upload's size report, after the bytes have landed.
# The file moves out of files/, so it runs once per file; the staging page imports it from there.
trigger:
  event: updated
  nodeType: file
  match:
    nodePath: ['/home/*/staging/files/**.ged', '/home/*/staging/files/**.GED']

steps:
  stage:
    command: gedcom-stage $NODE_PATH
    description: Move it to genealogy/, where the staging page asks who its individuals are before importing it

options:
  maxAttempts: 2
  priority: 5
