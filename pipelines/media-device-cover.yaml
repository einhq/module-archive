name: media-device-cover
description: Offer a video's poster frame to its device as a cover

# device-link covers a device as it links each file, which for a video is usually before its
# poster frame exists: a device that took only videos would stay uncovered. So a video's
# renditions being made is when its device is offered the poster frame. An image is covered at
# link time, as it needs no rendition to be picked, and a video linked to no device is passed over.
trigger:
  on: media.renditions.made
  wants: archive
  match:
    mimetype: 'video/*'

steps:
  device-cover:
    command: device-cover --media $NODE_PATH
    description: Offer the video's poster frame to its device as a cover

options:
  maxAttempts: 2
  priority: 5
